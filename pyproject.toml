[project]
name = "lcz-label-globe"
version = "0.1.0"
description = "A static globe of where the So2Sat-LCZ42 and WUDAPT LCZ training labels are"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyogrio>=0.10",
    "scikit-learn>=1.5",
    "shapely>=2.0",
]

[project.optional-dependencies]
# Only for build_demuzere_pmtiles.py, which turns the 1.3 GB Demuzere raster
# into a 3.3 GB PMTiles archive. The site itself reads that archive over HTTP
# range requests, so you do not need these to build or deploy the globe.
demuzere = [
    "pillow>=10.0",
    "pmtiles>=3.4",
    "rasterio>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Writes the fixture GeoPackages the offline tests build a site from.
    "geopandas>=1.0",
    # There is no node on this host, so the client tests run src/label_site/app.js
    # in QuickJS. They skip themselves if it is absent.
    "quickjs>=1.19.4",
    # A real browser. QuickJS stubs the DOM, so it cannot see activation
    # behaviour, hit testing or layout shifts -- all three have hidden real bugs
    # here. Browsers install to PLAYWRIGHT_BROWSERS_PATH.
    "playwright>=1.50",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
